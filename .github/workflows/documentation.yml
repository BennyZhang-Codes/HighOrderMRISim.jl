name: Documentation

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# New main builds replace older ones; PRs and dev use separate groups.
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Julia 1.12 documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: ''
      JULIA_CI: 'true'
      JULIA_LOAD_PATH: '@:@stdlib'
      JULIA_CPU_TARGET: generic
      JULIA_NUM_THREADS: '4'
      JULIA_NUM_PRECOMPILE_TASKS: '2'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONNOUSERSITE: '1'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: julia-actions/setup-julia@v3
        id: julia
        with:
          version: '1.12'

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'

      - name: Configure headless plotting and an isolated documentation depot
        id: depot
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON" -m pip install matplotlib
          printf 'PYTHON=%s\n' "$PYTHON" >> "$GITHUB_ENV"
          docs_depot="$RUNNER_TEMP/highordermrisim-docs-depot"
          printf 'JULIA_DEPOT_PATH=%s:\n' "$docs_depot" >> "$GITHUB_ENV"
          printf 'path=%s\n' "$docs_depot" >> "$GITHUB_OUTPUT"

      - name: Cache documentation dependencies and package images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.depot.outputs.path }}/artifacts
            ${{ steps.depot.outputs.path }}/compiled
            ${{ steps.depot.outputs.path }}/packages
            ${{ steps.depot.outputs.path }}/registries
          key: docs-julia-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.julia.outputs.julia-version }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('Project.toml', 'docs/Project.toml') }}

      - name: Instantiate the documentation environment
        run: julia --startup-file=no --project=docs -e 'using Pkg; Pkg.instantiate()'

      - name: Build the documentation
        run: julia --startup-file=no --project=docs docs/make.jl

      - name: Upload the documentation artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/build/

  deploy:
    name: Deploy documentation to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy the documentation artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
